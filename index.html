```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLC Dashboard</title>
<style>
body{margin:0;padding:24px;background:#101820;color:#fff;font-family:Arial,sans-serif}
h1{color:#45d6a0}
.card{background:#1c2935;padding:22px;border-radius:12px;margin-top:20px;max-width:600px}
.value{font-size:28px;color:#45d6a0;overflow-wrap:anywhere}
.status{color:#ffc857}
</style>
</head>
<body>
<h1>PLC Dashboard</h1>
<p>Endüstriyel İzleme Paneli</p>
<div class="card">
<h2>PLC Bağlantısı</h2>
<p id="status" class="status">Bağlanıyor...</p>
<h3>Gelen PLC Verisi</h3>
<div id="data" class="value">--</div>
<p id="updated">Henüz veri alınmadı</p>
</div>
<script>
const API = ""/api/plc-data";";

async function update() {
  try {
    const response = await fetch(API);
    if (!response.ok) throw new Error("HTTP " + response.status);
    const result = await response.json();

    let value = result.veri ?? result;
    if (typeof value === "string") {
      try { value = JSON.parse(value); } catch {}
    }

    document.getElementById("data").textContent =
      typeof value === "object" ? JSON.stringify(value) : String(value);
    document.getElementById("status").textContent = "● Veri alındı";
    document.getElementById("updated").textContent =
      "Son güncelleme: " + new Date().toLocaleTimeString("tr-TR");
  } catch (error) {
    document.getElementById("status").textContent =
      "● Bağlantı kurulamadı: " + error.message;
  }
}
update();
setInterval(update, 3000);
</script>
</body>
</html>
```
